name: News update

on:
  schedule:
    - cron: "0 0 * * *" # 08:00 Asia/Shanghai (00:00 UTC)
    - cron: "0 14 * * *" # 22:00 Asia/Shanghai (14:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Fetch, classify and persist news
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scripts.update_news
