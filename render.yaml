services:
  - type: web
    name: signalscope-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: SIGNALSCOPE_DATABASE_PATH
        value: /app/data/runtime/signalscope.db
      - key: SIGNALSCOPE_ADMIN_KEY
        generateValue: true
      - key: SIGNALSCOPE_SCHEDULER_ENABLED
        value: "false"
      - key: SIGNALSCOPE_SCHEDULER_INTERVAL_SECONDS
        value: "14400"
    disk:
      name: signalscope-data
      mountPath: /app/data/runtime
      sizeGB: 1
